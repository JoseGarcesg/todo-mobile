<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tasks
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tasks</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-input [(ngModel)]="newTask" placeholder="Nueva tarea"></ion-input>

    <ion-select [(ngModel)]="selectedCategory" placeholder="Categoría">
      <ion-select-option *ngFor="let c of categories" [value]="c.id">
        {{c.name}}
      </ion-select-option>
    </ion-select>

    <ion-button (click)="addTask()">Agregar</ion-button>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Filtrar por categoría</ion-label>
    <ion-select [(ngModel)]="filterCategory">
      <ion-select-option value="">Todas</ion-select-option>
      <ion-select-option value="none">Sin Categoría</ion-select-option>
      <ion-select-option *ngFor="let c of categories" [value]="c.id">
        {{c.name}}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let task of getFilteredTasks()">

      <ion-checkbox slot="start" [checked]="task.completed" (ionChange)="toggleTask(task.id)">
      </ion-checkbox>

      <ion-label>{{task.title}}</ion-label>
      <ion-label>Categoría: {{getCategoryName(task.categoryId)}}</ion-label>

      <ion-button color="danger" (click)="deleteTask(task.id)">
        Eliminar
      </ion-button>

    </ion-item>
  </ion-list>
</ion-content>
